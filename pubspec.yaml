name: flutter_course
description: "一个大而全的 Flutter 中文组件与实战课程：每个知识点都是一个可运行的 Demo。"
publish_to: 'none'

# 版本号格式：主.次.修订+构建号
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 网络请求
  http: ^1.6.0
  # 国际化（日期 / 数字格式化，gen-l10n 生成代码依赖它）
  intl: ^0.20.3
  # 本地存储
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # 一键生成各平台 App 图标：dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4
  # 一键生成原生启动页：dart run flutter_native_splash:create
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  # 根据 l10n.yaml 与 lib/l10n/*.arb 自动生成 AppLocalizations
  generate: true

# ---------------- App 图标 ----------------
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  # Android 8.0+ 自适应图标：前景（透明底 Logo）+ 背景色
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# ---------------- 启动页 ----------------
flutter_native_splash:
  color: "#1E88E5"
  image: "assets/icon/splash_logo.png"
  color_dark: "#0D2B4F"
  android_12:
    color: "#1E88E5"
    image: "assets/icon/splash_logo.png"
    color_dark: "#0D2B4F"
